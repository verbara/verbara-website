# Wrangler config — Workers + Static Assets + bridged Functions.
#
# Cloudflare deployed verbara.io as a Worker (script name `verbara-website`).
# We use the Workers + Static Assets pattern (`main` Worker entry + `[assets]`
# binding) instead of Pages-style auto-functions because the latter requires
# a Pages project and this account doesn't have one (only Worker scripts).
#
# The Worker entry at src/worker.ts manually routes /api/developer-license
# to the function file under functions/ — that bridges the existing function
# code into the Workers runtime without rewriting it.
#
# Operator runbook lives at docs/operations/issuer-setup.md.

name = "verbara-website"
compatibility_date = "2026-05-09"
compatibility_flags = ["nodejs_compat"]
main = "src/worker.ts"

# Static assets — the built Astro site (npm run build emits to dist/).
# `not_found_handling = "404-page"` returns dist/404.html for unknown paths
# if Astro generated one, otherwise standard 404.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# D1: append-only audit log of every Tier 0.5 license issuance.
[[d1_databases]]
binding = "LICENSE_AUDIT_DB"
database_name = "verbara-license-audit"
database_id = "83f40aa0-d408-46a2-9227-c1f396dcb420"
migrations_dir = "migrations"

# KV: per-IP rate-limit counters (5 issuances per IP per 24 h).
# Email-level dedup (1 per email per 30 d) lives in D1, not KV.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "3b4730d6fb444c18afad7029496920f6"

# Daily drift-detection cron (Phase 2.3 of Pro v2.3.x image-binding plan).
# Re-resolves every entry in data/authorized-digests.json against ghcr.io
# and emails security@verbara.io if any manifest-list digest no longer
# matches the recorded value. See src/drift-detection.ts.
#
# Schedule: 03:17 UTC daily — chosen off-hour and off-minute to avoid the
# 0-minute thundering-herd against ghcr.io that everyone else's cron picks.
[triggers]
crons = ["17 3 * * *"]
