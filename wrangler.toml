# Wrangler config for the verbara.io marketing site.
#
# Cloudflare deploys this via the unified Workers Pages model — uses
# `pages_build_output_dir` (Pages-style directive) which Cloudflare's build
# pipeline understands, even though the resulting deployment lives under the
# Workers script namespace (verbara-website at /workers/scripts).
#
# Bindings (D1 + KV + secrets) consumed by the Tier 0.5 license issuer at
# functions/api/developer-license/index.ts. Cloudflare's build pipeline reads
# this file at deploy time and applies the bindings to the deployed Worker.
#
# Operator runbook lives at docs/operations/issuer-setup.md.

name = "verbara-website"
compatibility_date = "2026-05-09"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# D1: append-only audit log of every Tier 0.5 license issuance.
[[d1_databases]]
binding = "LICENSE_AUDIT_DB"
database_name = "verbara-license-audit"
database_id = "83f40aa0-d408-46a2-9227-c1f396dcb420"
migrations_dir = "migrations"

# KV: per-IP rate-limit counters (5 issuances per IP per 24 h).
# Email-level dedup (1 per email per 30 d) lives in D1, not KV.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "3b4730d6fb444c18afad7029496920f6"
