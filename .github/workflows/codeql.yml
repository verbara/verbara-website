name: CodeQL

# Static security analysis (SAST) for the site's own JS/TS — the Astro components
# AND the Cloudflare Pages Functions in functions/api/ that back the trust/licensing
# surface (D1 license_audit + authorized_image_digests). This is the security-baseline
# symmetry the other Verbara repos already carry (verbara-meta ADR-0003); ci.yml gates
# build/lint/i18n/digests, CodeQL scans the source for vulnerabilities. Free on PUBLIC repos.
#
# JS/TS needs no build for extraction (build-mode: none is the CodeQL default for this
# language), so there is no npm install / astro build step here.
#
# Triggers mirror the JS/TS sibling (Platform.Web): push:[main] keeps the default-branch
# baseline fresh (the merge_group ref is not main, so it cannot), pull_request gates each PR,
# weekly schedule re-scans for newly-disclosed query patterns. Deliberately NO merge_group —
# CodeQL stays PR-gated, not queue-required, so it can never hang the merge queue.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs/data-only fast-path §2 (verbara-meta/ADR-0016): CodeQL is NON-required — ruleset
    # 17662978 requires only quality/coverage/e2e/OpenSpec Validate (verified 2026-07-27) — and it
    # has NO merge_group trigger, so a workflow-level paths-ignore is SAFE here: there is no
    # required context to strand (unlike ci.yml, where paths-ignore is BANNED and the §1 gate job
    # is used instead). The list is the allowlist INVERSE of §3.4, deliberately wider than the
    # classifier's: `data/*.json` is a JSON ledger, not JS/TS, and CodeQL extracts neither it nor
    # markdown. Do NOT cross-copy this list into the classifier. push:[main] + the weekly schedule
    # stay UNFILTERED, so the default-branch security baseline is unaffected.
    # IF `Analyze (JS/TS)` IS EVER ADDED TO ruleset 17662978's REQUIRED CONTEXTS, DELETE THIS
    # FILTER FIRST — a path-skipped workflow emits NO check-run, so the context would strand in
    # `Expected` forever on every docs/data-only PR (ADR-0016 §2's banned trap).
    paths-ignore:
      - 'data/*.json'
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
  schedule:
    - cron: '0 6 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: '/language:javascript-typescript'
