name: ci

# Triggers: pull_request validates each PR; merge_group runs the gate on the tentative
# merge before it lands. push:[main] was dropped — it re-tested the exact tree the PR had
# already validated (redundant double-run per PR). Matches verbara-meta ADR-0003.
on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # Docs/data-only CI fast-path gate (verbara-meta/ADR-0016 §1 — the DATA-AWARE variant).
  # Classifies the PR / merge_group diff against the event's OWN base and exposes docs_only.
  # GATED: required `coverage` + `e2e`, plus non-required `test` and `lighthouse` — all report a
  # satisfying `skipped` on a docs/data-only diff.
  # ALWAYS-RUN, no `needs: gate` edge (§3.3): required `quality` and required `OpenSpec Validate`.
  # `quality` is the data-aware carve-out and now runs the FULL ledger guard set —
  # `npm run validate:digests` (gates.yaml G5) AND `npm test` (vitest, whose loadRegistry* cases
  # import data/authorized-digests.json through functions/api/developer-license/
  # authorized-digests.ts) — plus the 4s production astro build. `coverage` may therefore be gated
  # without weakening enforcement: vitest is now merge-BLOCKING on every PR class, which it was
  # not before (the `test` job is not a required context; ruleset 17662978 requires only
  # OpenSpec Validate / coverage / e2e / quality).
  # Triggers stay UNCHANGED (pull_request + merge_group, no path filter): a workflow-level
  # paths-ignore on ci.yml is BANNED — it would strand all four required contexts as `Expected`.
  # Allowlist (§3.4, website row): data/*.json (top-level only), docs/**, openspec/**,
  # CHANGELOG.md, top-level *.md, **/README.md — minus src/pages/* and public/*.
  gate:
    name: Docs-only gate
    runs-on: ubuntu-latest
    timeout-minutes: 5 # bounds the new critical-path job (ruleset 17662978 waits 60 min)
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # base sha must be reachable for the diff

      - id: classify
        env: # §3.1 event-specific base — never hardcode origin/main
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        # Invoked via `bash` (not ./) so the committed file mode is never load-bearing, and the
        # verdict is echoed to the LOG as well as to $GITHUB_OUTPUT (wave-1 gap). Command
        # substitution under the default `bash -e` shell preserves the classifier's exit status,
        # so a crash FAILS this job => heavy jobs RUN (fail-closed).
        run: |
          verdict="$(bash ./scripts/ci/classify-docs-only.sh "$BASE_SHA" "${{ github.sha }}")"
          echo "classify-docs-only: $verdict"
          echo "$verdict" >> "$GITHUB_OUTPUT"

  # ALWAYS-RUN — NO `needs: gate` edge (verbara-meta/ADR-0016 §3.3). This is the data-aware
  # carve-out: `npm run validate:digests` is the security-critical structural guard on
  # data/authorized-digests.json (gates.yaml G5), `npm test` exercises the real ledger through the
  # production import path, and `npm run build` is the production astro build (measured 4s — it
  # already IS the "minimal build" §4 asks for; no cheaper variant is needed). A docs/data diff
  # must clear all three. This job also hosts the §3.4 classifier unit tests (last step).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check
      - run: npm run lint
      - run: npm run test:i18n
      - run: npm run validate:digests
      # verbara-meta/ADR-0016: vitest moves INTO the required, always-run job. `coverage` (which
      # ran the same suite) is now gated, and the standalone `test` job is NOT a required context
      # — without this line a ledger or unit regression on a docs/data-only PR would be advisory
      # only. ~2s here (npm ci already paid) vs. a whole job elsewhere.
      - run: npm test
      - run: npm run build
      - run: npm run validate:html

      # Docs/data-only fast-path classifier unit tests (verbara-meta/ADR-0016 §3.4). They ride the
      # ALWAYS-RUN, REQUIRED `quality` job on purpose: this repo has no script-test job (wave-1's
      # host) and its required set lives in ruleset 17662978, whose PUT is operator-gated — so this
      # is the only PUT-free way to make a mis-widened allowlist merge-BLOCKING. `quality` carries
      # no `needs: gate` edge, so the tests always run on the very PR that edits the classifier
      # (itself never docs_only: scripts/ci/... is a nested non-doc path, asserted by two cases).
      # Pure bash + git, no Node/Python, ~2s.
      - name: Run docs-only classifier unit tests (ADR-0016)
        run: bash scripts/tests/test_classify_docs_only.sh

      # Coverage-script unit tests (verbara-meta/ADR-0013). `check-patch-coverage.py` has run the
      # patch gate here since #68 with NO suite behind it — the other four ADR-0013 repos each have
      # a `Coverage Script Tests` job, and this repo was the exception. It rides `quality` for the
      # same reason the line above does: always-run and required without a ruleset PUT. Crucially
      # `quality` has no `needs: gate` edge, so the suite runs on the very PR that edits the script.
      # The file is byte-identical to the other four copies; a green here is what makes that
      # `cp`-and-checksum replication verifiable rather than merely asserted. ~2s, stdlib only.
      - name: Run coverage-script unit tests (ADR-0013)
        run: python3 -m unittest discover scripts/tests

  # Vitest unit tier (ADR-0014 §2 G3). Runs the non-Astro logic unit tests:
  # the security-critical authorized-digests validator, the i18n parity +
  # path helpers, the Cloudflare Pages Functions (license issuer), and the
  # drift-detection cron. Fast (~1s, no browser). The coverage job below is the
  # authoritative ADR-0013 gate. The same `vitest run` now also executes inside the
  # required always-run `quality` job (ADR-0016); this job is the standalone signal
  # and is gated — skipping a non-required job strands nothing. Deleting it as fully
  # redundant is a follow-up, deliberately out of scope for the ADR-0016 rollout.
  test:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  # Coverage-gate-v2 (verbara-meta/ADR-0013), verbara-website variant. Two gates
  # over the vitest v8 report emitted by `npm run test:coverage`
  # (coverage-summary.json + lcov.info):
  #   * band backstop (clause b) — check-coverage-floor.py reads
  #     coverage-summary.json: fail below floor OR above floor+slack (stale
  #     floor), plus a blocking branch floor + lines_valid_min denominator floor.
  #   * patch gate (clause a) — check-patch-coverage.py reads lcov.info: coverage
  #     of the lines changed vs origin/main must be >= coverage-floor.json.patch.
  #   * denominator guard — check-exclusion-baseline.py: net-new `c8 ignore`
  #     markers fail the build (shrinking the denominator games both gates).
  # The vitest.config.ts thresholds (86/90/84/86) STAY as a redundant fast-fail
  # liveness backstop. The triplet scripts are byte-identical to Web's.
  coverage:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is REQUIRED by coverage-gate-v2 (verbara-meta/ADR-0013):
          # check-patch-coverage.py needs `git merge-base origin/main HEAD`, which
          # a shallow clone cannot resolve. Works on both pull_request and
          # merge_group refs. The script's liveness self-test fails loud if this
          # is ever removed (an empty merge-base reads as a shallow clone).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install diff-cover (pinned)
        # The only new supply-chain surface for the patch gate. Pinned exactly
        # (ADR-0013). ubuntu runners ship python3 + pip.
        run: pip install --disable-pip-version-check diff_cover==10.3.0

      - run: npm ci

      - name: Run coverage
        # Emits ./coverage/coverage-summary.json (band) + ./coverage/lcov.info
        # (patch) via the json-summary + lcov vitest reporters.
        run: npm run test:coverage

      - name: Enforce coverage band (manual ratchet, two-sided)
        # coverage-gate-v2 backstop (ADR-0013 clause b): fail below floor OR above
        # floor+slack (stale floor), plus blocking branch floor + lines_valid_min.
        run: python3 scripts/check-coverage-floor.py ./coverage/coverage-summary.json coverage-floor.json

      - name: Enforce patch coverage (diff-cover)
        # coverage-gate-v2 primary gate (ADR-0013 clause a): coverage of the lines
        # changed vs origin/main must be >= coverage-floor.json["patch"].
        run: python3 scripts/check-patch-coverage.py ./coverage/lcov.info coverage-floor.json

      - name: Enforce coverage-exclusion baseline (denominator guard)
        # coverage-gate-v2 denominator guard (ADR-0013): net-new `c8 ignore`
        # markers fail the build (shrinking the denominator would game both gates).
        run: python3 scripts/check-exclusion-baseline.py coverage-exclusion-baseline.json .

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: ./coverage
          retention-days: 14
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: [gate, quality]
    # ADR-0016 §3.2 adapted for a job that ALREADY had a `needs:` edge: `!cancelled()` drops
    # GitHub's implicit success() over ALL needs, not just `gate`, so `needs.quality.result ==
    # 'success'` MUST be re-asserted or e2e would start running on a RED quality (a 3.5-min
    # regression + a confusing double-red). Trace: quality green + code => RUN; quality green +
    # docs/data => SKIP (a skipped required context satisfies ruleset 17662978); gate
    # failed/skipped => RUN (fail-closed); quality red => SKIP, exactly as today.
    if: ${{ !cancelled() && needs.quality.result == 'success' && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: [gate, quality]
    # Non-required (gates.yaml G6), gated anyway — safe: a non-required job skipping on a
    # docs/data diff strands nothing (the precedent Platform documented in-repo for
    # `live-db-tests`). Same COMPOUND guard as `e2e`: this job already had a `needs: quality`
    # edge, and `!cancelled()` drops GitHub's implicit success() over ALL needs, so
    # `needs.quality.result == 'success'` MUST be re-asserted or lighthouse would start running
    # on a RED quality. Never "simplify" this back to the plain §3.2 one-liner.
    if: ${{ !cancelled() && needs.quality.result == 'success' && (needs.gate.result != 'success' || needs.gate.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:lhci

  # OpenSpec docs gate (2026-07-05 config-drift audit): the living specs + changes are
  # agent-edited markdown with a strict parser — validate them like code. Pinned CLI
  # version (upgrade deliberately). Runs on PR + merge_group like every other gate.
  # ALWAYS-RUN — no `needs: gate` edge (verbara-meta/ADR-0016 §3.3): cheap, and it validates
  # exactly the openspec/** part of a docs diff.
  openspec:
    name: OpenSpec Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate specs and changes (strict)
        run: npx -y @fission-ai/openspec@1.8.0 validate --all --strict --no-interactive
