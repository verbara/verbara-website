name: ci

# Triggers: pull_request validates each PR; merge_group runs the gate on the tentative
# merge before it lands. push:[main] was dropped — it re-tested the exact tree the PR had
# already validated (redundant double-run per PR). Matches verbara-meta ADR-0003.
on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check
      - run: npm run lint
      - run: npm run test:i18n
      - run: npm run validate:digests
      - run: npm run build
      - run: npm run validate:html

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:lhci

  # OpenSpec docs gate (2026-07-05 config-drift audit): the living specs + changes are
  # agent-edited markdown with a strict parser — validate them like code. Pinned CLI
  # version (upgrade deliberately). Runs on PR + merge_group like every other gate.
  openspec:
    name: OpenSpec Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate specs and changes (strict)
        run: npx -y @fission-ai/openspec@1.4.1 validate --all --strict --no-interactive
