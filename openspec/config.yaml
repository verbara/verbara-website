schema: spec-driven

context: |
  verbara-website — the public marketing/docs website. Stack: Astro 6 + Tailwind 4 on Cloudflare
  (Workers + Static Assets pattern: src/worker.ts entry routes manually and delegates to handlers in
  functions/, static site served via env.ASSETS; D1 for license audit + authorized digests). Standalone
  in the ecosystem — it does NOT consume the .NET SDK/Pro/Platform packages and is not part of the
  Sdk -> Pro -> Platform dependency chain.

  Constraints:
  - Astro 6 + Tailwind 4 conventions; the Cloudflare Workers build (npm run build + wrangler) must pass.
  - Keep it lightweight and static-first; Worker routes/D1 only where dynamic behavior is required.

  Cross-repo standards live in the private verbara-meta repo as ADRs.

rules:
  proposal:
    - "Set a `tier` in frontmatter: GRANDE (>3 days or a product/brand decision), MEDIANO (1-3 days), or PEQUEÑO (small fix, <1 day). PEQUEÑO may keep the proposal light."
    - "Add product-ownership frontmatter: owner, approver, stakeholder, decision_ref (repo-qualified ADR that motivates or records this change, e.g. website/ADR-NNNN, or verbara-meta/ADR-NNNN for ecosystem standards; create or extend an ADR in docs/decisions/ when the change embodies a durable decision). With a single developer, owner = approver."
    - "Cross-repo ADR citations MUST be repo-qualified in ANY doc, not just decision_ref (verbara-meta/ADR-0011, three-way collision): a bare `ADR-NNNN` always refers to THIS repo's docs/decisions/; cite another repo's ADR as `<repo>/ADR-NNNN` (e.g. website/ADR-0003, Pro/ADR-0012, verbara-meta/ADR-0006)."
    - "State the problem (what pain, for whom) for GRANDE and MEDIANO tiers."
    - "Public-repo content rule (verbara-meta/ADR-0005, applies to ALL artifacts of a change): never include secrets/keys/tokens, customer or personal data, absolute machine paths, partner-specific commercial terms, or reproductions of private-repo content — reference private repos only as opaque names (e.g. verbara-meta/ADR-NNNN, Pro/ADR-NNNN); when in doubt the artifact goes in the private repo's docs and the public change carries the opaque reference."
  specs:
    - "Use RFC 2119 keywords: SHALL/MUST for non-negotiable requirements, SHOULD for desirable, MAY for optional."
    - "Write scenarios as GIVEN/WHEN/THEN."
    - "Include an Architectural Risk section as an H2 heading ('## Architectural Risk', a sibling of the delta sections — NEVER a '###' header inside requirements: openspec archive rebuilds every '###' as a requirement and aborts): Level (LOW/MEDIUM/HIGH), Affected, Mitigation. Note any Cloudflare Worker/D1 impact. Keep SHALL/MUST on the first line of each '### Requirement:'."
  design:
    - "Reference existing ADRs when relevant. Prefer static-first; justify any Functions/D1 usage."
    - "Record any durable architectural decision as an ADR in docs/decisions/, not only in this design."
  tasks:
    - "Verification tasks MUST include a clean Astro/Cloudflare build and a check of the affected pages."
    - "E2E/Playwright tasks MUST follow the anti-flake fences: no waitForTimeout/wall-clock waits, assert via expect(...) polling or waitForResponse, and respect the suite posture (workers: undefined locally / 2 in CI, retries: 0 locally / 2 in CI, data-testid selectors). AI-generated specs are held to the same rule."
    - "Changes touching user-visible strings MUST keep i18n parity across the three locales (es-419, en-US, pt-BR), CI-enforced via `npm run test:i18n`."
    - "Use Subagent-Driven Development with FCM batching where the change is non-trivial."
