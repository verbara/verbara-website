schema: spec-driven

context: |
  verbara-website — the public marketing/docs website. Stack: Astro 5 + Tailwind 4 on Cloudflare
  (Pages / Functions / D1). Standalone in the ecosystem — it does NOT consume the .NET SDK/Pro/Platform
  packages and is not part of the Sdk -> Pro -> Platform dependency chain.

  Constraints:
  - Astro 5 + Tailwind 4 conventions; Cloudflare Pages build must pass.
  - Keep it lightweight and static-first; Functions/D1 only where dynamic behavior is required.

  Cross-repo standards live in the private verbara-meta repo as ADRs.

rules:
  proposal:
    - "Set a `tier` in frontmatter: GRANDE (>3 days or a product/brand decision), MEDIANO (1-3 days), or PEQUEÑO (small fix, <1 day). PEQUEÑO may keep the proposal light."
    - "Add product-ownership frontmatter: owner, approver, stakeholder, roadmap_ref. With a single developer, owner = approver."
    - "State the problem (what pain, for whom) for GRANDE and MEDIANO tiers."
  specs:
    - "Use RFC 2119 keywords: SHALL/MUST for non-negotiable requirements, SHOULD for desirable, MAY for optional."
    - "Write scenarios as GIVEN/WHEN/THEN."
    - "Include an Architectural Risk section: Level (LOW/MEDIUM/HIGH), Affected, Mitigation. Note any Cloudflare D1/Functions impact."
  design:
    - "Reference existing ADRs when relevant. Prefer static-first; justify any Functions/D1 usage."
  tasks:
    - "Verification tasks MUST include a clean Astro/Cloudflare build and a check of the affected pages."
    - "Use Subagent-Driven Development with FCM batching where the change is non-trivial."
