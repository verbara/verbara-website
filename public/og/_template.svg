<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Ink background -->
  <rect width="1200" height="630" fill="#0a1628"/>

  <!-- Subtle inset border accent -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#0f2138" stroke-width="2"/>

  <!-- Mark top-left -->
  <g transform="translate(80 80)">
    <path d="M10 18 L32 50 L54 18" fill="none" stroke="#e8eef5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 32 H42" stroke="#40d9ff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark next to mark -->
  <text x="160" y="124"
        font-family="'Geist Sans', 'Helvetica Neue', sans-serif"
        font-weight="700"
        font-size="48"
        letter-spacing="-1.5"
        fill="#e8eef5">Verbara</text>

  <!-- Headline (universal English claim per spec §2 anti-positioning) -->
  <text x="80" y="320"
        font-family="'Geist Sans', 'Helvetica Neue', sans-serif"
        font-weight="700"
        font-size="64"
        letter-spacing="-2"
        fill="#e8eef5">The AI-ready contact center</text>
  <text x="80" y="400"
        font-family="'Geist Sans', 'Helvetica Neue', sans-serif"
        font-weight="700"
        font-size="64"
        letter-spacing="-2"
        fill="#e8eef5">you can <tspan fill="#ffb547">audit, self-host, own.</tspan></text>

  <!-- Subline -->
  <text x="80" y="470"
        font-family="'Geist Sans', 'Helvetica Neue', sans-serif"
        font-weight="500"
        font-size="28"
        letter-spacing="-0.5"
        fill="rgba(232,238,245,0.65)">Open-core, Asterisk-native CCaaS for operators tired of vendor lock-in.</text>

  <!-- Bottom strip: URL + license badges -->
  <text x="80" y="570"
        font-family="'Geist Mono', 'Menlo', monospace"
        font-size="24"
        fill="#40d9ff">verbara.io</text>
  <text x="1120" y="570" text-anchor="end"
        font-family="'Geist Mono', 'Menlo', monospace"
        font-size="20"
        fill="rgba(232,238,245,0.4)">MIT SDK · Apache Platform · 0 vulns</text>

  <!-- Subtle signal-cyan accent at very bottom -->
  <rect x="40" y="585" width="80" height="3" fill="#40d9ff"/>
</svg>
